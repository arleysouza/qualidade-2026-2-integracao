name: Testes de integração

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aula3_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d aula3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Verificar os tipos
        run: npm run test:typecheck
      - name: Compilar a aplicação
        run: npm run build
      - name: Executar integração com cobertura
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/aula3_test
        run: npm run test:coverage -- --ci
      - name: Publicar relatório de cobertura
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: integration-coverage
          path: server/coverage/
          if-no-files-found: ignore
          retention-days: 7
